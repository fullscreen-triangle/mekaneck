[workspace]
resolver = "2"
members = ["crates/algebra", "crates/kernel", "crates/lang", "crates/substrates", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kundai Farai Sachikonye <kundai.sachikonye@tum.de>"]
repository = "https://github.com/fullscreen-triangle/mekaneck"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
