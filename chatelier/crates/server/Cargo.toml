[package]
name = "mekaneck-server"
description = "Loopback-only HTTP/WebSocket server pairing the local binary with a browser IDE"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
mekaneck-algebra = { path = "../algebra" }
mekaneck-kernel = { path = "../kernel" }
mekaneck-lang = { path = "../lang" }
mekaneck-substrates = { path = "../substrates" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
getrandom = "0.3"
subtle = "2"
ts-rs = "12"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
